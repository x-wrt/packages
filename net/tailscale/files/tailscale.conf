config settings 'settings'
	option log_stderr '1'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	# Use main without Tailscale policy rules; use 52 for policy routing.
	option route_table 'main'
	# Higher metrics have lower priority for routes with the same prefix.
	option route_metric '4096'
	# Firewall backend: iptables or nftables.
	option fw_mode 'iptables'
